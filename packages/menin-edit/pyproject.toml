[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "menin-edit"
version = "0.1.0"
description = "Explainable, constrained, stepwise molecular editing for Menin inhibitor optimization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "menin-discovery>=0.3,<0.4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "PyYAML>=6,<7",
  "rdkit>=2024.3",
  "scikit-learn>=1.4,<2",
  "skops>=0.10,<1",
]

[project.optional-dependencies]
lab = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
menin-edit = "menin_edit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../pipeline/src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
