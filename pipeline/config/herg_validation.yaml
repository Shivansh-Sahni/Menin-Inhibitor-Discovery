# the strongest candidates plus the best member of every requested family
# advance to later rungs.
successive_keep_fraction: 0.40
successive_minimum_candidates: 10
ensemble_size: 3

applicability_quantile: 0.05
calibration_bins: 8
bootstrap_iterations: 2000

