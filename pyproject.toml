[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "menin-discovery"
version = "0.3.0"
description = "Reproducible protein-molecule evidence, cardiac-safety, PK/ADME, and pretraining-readiness platform with a preserved Menin workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.84,<2",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "olefile>=0.47,<1",
  "pandas>=2.2,<4",
  "pandera>=0.20,<1",
  "pyarrow>=16,<24",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rdkit>=2024.3",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "seaborn>=0.13,<1",
  "skops>=0.10,<1",
  "urllib3>=2,<3",
]

[project.scripts]
menin-pipeline = "menin_discovery.cli:main"
menin-research = "menin_discovery.research_cli:main"
protein-molecule-platform = "menin_discovery.platform_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]
external = [
  "PyTDC>=1.1.15; python_version < '3.13'",
]
herg-benchmark = [
  "lightgbm>=4.5,<5",
  "openpyxl>=3.1,<4",
  "torch>=2.5,<3",
  "xgboost>=2.1,<4",
]

[tool.setuptools.packages.find]
where = ["pipeline/src"]

[tool.setuptools.package-data]
menin_discovery = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline/src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true

[tool.coverage.run]
source = ["menin_discovery"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
