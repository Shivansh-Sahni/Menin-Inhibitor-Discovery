name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade secure packaging toolchain
        run: python -m pip install --upgrade "setuptools>=83"
      - name: Install
        run: python -m pip install -e ".[dev]" -e "./packages/menin-edit[lab,dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Install pinned dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit macOS CPython 3.13 provenance lock
        run: >-
          python -m pip_audit --strict --no-deps --disable-pip
          --progress-spinner off
          --requirement pipeline/environments/requirements.lock
      - name: Audit resolved matrix environment (excluding local editable source packages)
        shell: bash
        run: |
          python -m pip freeze --all --exclude-editable > "$RUNNER_TEMP/installed-environment.txt"
          python -m pip_audit --strict --no-deps --disable-pip \
            --progress-spinner off \
            --requirement "$RUNNER_TEMP/installed-environment.txt"
      - name: Lint
        run: ruff check pipeline/src pipeline/scripts pipeline/tests packages/menin-edit/src packages/menin-edit/tests
      - name: Format check
        run: ruff format --check pipeline/src pipeline/scripts pipeline/tests packages/menin-edit/src packages/menin-edit/tests
      - name: Type check
        run: mypy pipeline/src/menin_discovery packages/menin-edit/src/menin_edit
      - name: Test
        run: pytest --cov=menin_discovery --cov-report=term-missing --cov-report=xml
      - name: Test Menin-Edit package
        run: pytest -q packages/menin-edit/tests

  offline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Rebuild checked-in public snapshot without network
        run: menin-pipeline --stage all --skip-network --fast
      - name: Ensure generated files are internally consistent
        run: menin-pipeline --stage verify --skip-network --fast
